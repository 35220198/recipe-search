<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="brand">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 22a8 8 0 0 1 4-15 9 9 0 0 1 17-1 8 8 0 0 1 7 16v3H10z" fill="#fff"/><rect x="12" y="27" width="24" height="15" rx="3" fill="#ffd23f"/><path d="M18 31v7M24 31v7M30 31v7" stroke="#17402f" stroke-width="2.500" stroke-linecap="round"/></svg>
        <h1>Recipe Search</h1>
      </div>
      <p class="desc" id="desc">Search thousands of recipes by name or ingredient, filter by category, and open any dish for ingredients and step-by-step instructions. Save favourites, pick a random meal, and cook from any device. Works offline with built-in samples.</p>

      <form class="searchbar" id="searchForm" role="search">
        <select id="mode" aria-label="Search by">
          <option value="name">Name</option>
          <option value="ingredient">Ingredient</option>
        </select>
        <input id="q" type="search" placeholder="Try chicken, pasta, rice..." aria-label="Search recipes" autocomplete="off">
        <button type="submit" class="go">Search</button>
      </form>
      <div class="actions">
        <button type="button" class="pill" id="randomBtn">&#127922; Surprise me</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs" aria-label="View">
      <button type="button" class="tab" id="tabDiscover" aria-pressed="true">Discover</button>
      <button type="button" class="tab" id="tabFavs" aria-pressed="false">Favourites <span id="favCount">0</span></button>
    </nav>

    <div class="chips" id="chips" role="group" aria-label="Categories"></div>

    <div class="headrow"><h2 id="heading">Recipes</h2><span class="note" id="note"></span></div>
    <ul class="grid" id="grid" aria-live="polite"></ul>
  </main>

  <dialog id="dlg" aria-labelledby="dTitle">
    <article class="detail">
      <button type="button" class="close" id="dClose" aria-label="Close">&times;</button>
      <div class="d-img" id="dImg"></div>
      <div class="d-body">
        <div class="d-top">
          <h2 id="dTitle"></h2>
          <button type="button" class="heart big" id="dFav" aria-pressed="false" aria-label="Save to favourites">&#9825;</button>
        </div>
        <div class="meta" id="dMeta"></div>

        <h3>Ingredients <button type="button" class="mini" id="copyBtn">Copy list</button></h3>
        <ul class="ings" id="dIngs"></ul>

        <h3>Instructions</h3>
        <ol class="steps" id="dSteps"></ol>

        <div class="links" id="dLinks"></div>
      </div>
    </article>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
